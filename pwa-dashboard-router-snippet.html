<!--
  Bush Hills Church of Christ - PWA dashboard router
  Paste into: Durable > Website Settings > Integrations > Custom Code > Footer Code
  (add as a FOURTH <script> block alongside the live-stream, iOS-banner, and
  announcements-feed scripts already there - do not replace them, append
  this one below the other three)

  Site-wide. Does nothing at all in a normal browser tab - only acts when
  display-mode is "standalone" (i.e. the app was launched from its home
  screen icon, not a browser). In that case:

  1. If the installed app lands on the homepage ("/"), silently swaps it
     for the hidden /dashboard page instead - this is the belt-and-suspenders
     fallback for manifest.json's start_url (which points new installs at
     /dashboard directly; this covers already-installed apps whose start_url
     got baked in before that change, e.g. Android's WebAPK).
     Tapping "Browse full site" on the dashboard (a link to "/?app_full=1")
     bypasses this for the rest of that app session, so browsing the real
     site from there doesn't keep bouncing back to the dashboard.
  2. Adds a small floating "back to dashboard" button on every page except
     /dashboard itself, since the dashboard is meant to act as the app's
     home base while browsing - there's no browser address bar in standalone
     mode to type a URL into.
  3. On /dashboard and /notes specifically, hides Durable's own site
     header/nav so those two pages read as dedicated app screens instead of
     regular site pages. There's no way to know Durable's internal class
     names from outside its editor, so instead of guessing a CSS selector
     that might not exist, this climbs up from our own embedded content
     (#bhcoc-dashboard or #bhcoc-notes) to whatever element sits right
     before it in the page and hides that - which, structurally, has to be
     the header/nav, whatever Durable happens to call it. It's restored
     automatically the moment you navigate to any other page.

  Durable's site is a Next.js single-page app - clicking nav links doesn't
  reload the page, it swaps content in place - so this polls the current
  path like the live-stream script does, instead of only checking once.
-->
<script>
(function () {
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isStandalone) return;

  var DASHBOARD_PATH = '/dashboard';
  var NOTES_PATH = '/notes';
  var BYPASS_KEY = 'bhcoc-pwa-full-site';

  if (window.location.search.indexOf('app_full=1') !== -1) {
    sessionStorage.setItem(BYPASS_KEY, '1');
  } else if (
    window.location.pathname === '/' &&
    !sessionStorage.getItem(BYPASS_KEY)
  ) {
    window.location.replace(DASHBOARD_PATH);
    return;
  }

  function isAppScreen(path) {
    return path === DASHBOARD_PATH || path === NOTES_PATH;
  }

  function ensureHomeButton() {
    var existing = document.getElementById('bhcoc-pwa-home-btn');
    if (window.location.pathname === DASHBOARD_PATH) {
      if (existing) existing.remove();
      return;
    }
    if (existing) return;

    var btn = document.createElement('a');
    btn.id = 'bhcoc-pwa-home-btn';
    btn.href = DASHBOARD_PATH;
    btn.setAttribute('aria-label', 'Back to Dashboard');
    btn.textContent = '⌂';
    btn.style.cssText = 'position:fixed; right:16px; bottom:16px; z-index:99999; width:52px; height:52px; border-radius:50%; background:#7A3E1D; color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; text-decoration:none; box-shadow:0 4px 16px rgba(0,0,0,0.3);';
    document.body.appendChild(btn);
  }

  var hiddenChromeEls = [];

  function hideSiteChrome() {
    if (hiddenChromeEls.length) return;
    var content = document.getElementById('bhcoc-dashboard') || document.getElementById('bhcoc-notes');
    if (!content) return;

    var node = content;
    while (node && node.parentElement && node !== document.body) {
      if (node.previousElementSibling) {
        var sib = node.previousElementSibling;
        while (sib) {
          sib.style.setProperty('display', 'none', 'important');
          hiddenChromeEls.push(sib);
          sib = sib.previousElementSibling;
        }
        return;
      }
      node = node.parentElement;
    }
  }

  function restoreSiteChrome() {
    if (!hiddenChromeEls.length) return;
    hiddenChromeEls.forEach(function (el) {
      el.style.removeProperty('display');
    });
    hiddenChromeEls = [];
  }

  var lastPath = null;
  function sync() {
    var path = window.location.pathname;
    if (path !== lastPath) {
      lastPath = path;
      ensureHomeButton();
    }

    if (isAppScreen(path)) {
      hideSiteChrome();
    } else {
      restoreSiteChrome();
    }
  }
  sync();
  setInterval(sync, 500);
})();
</script>
