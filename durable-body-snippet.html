  site - Chrome throws "The URL protocol of the script is not supported").

  There is no client-side workaround for this. A real fix would require
  serving sw.js as a genuine same-origin https:// file from
  bushhillschurch.com itself - e.g. proxying the domain's DNS through a
  Cloudflare Worker that serves /sw.js and lets everything else pass
  through to Durable. That's a separate, larger project requiring DNS
  access, out of scope here.

  The installable home-screen app (manifest.json + icons, via the Head
  snippet) does not depend on any of this and works without a service
  worker. See README.md for details.
