<!--
  Bush Hills Church of Christ - iOS install banner
  Paste into: Durable > Website Settings > Integrations > Custom Code > Footer Code
  (add this as an ADDITIONAL <script> block alongside the existing live-stream
  script already in that box - do not replace it, just add this below it)

  Shows a small dismissible banner, site-wide, only to iPhone/iPad Safari
  visitors who haven't already installed the app, pointing them to
  Share -> Add to Home Screen (iOS has no automatic install prompt like
  Android Chrome does, so this is the only way people discover it).
  Dismissal is remembered via localStorage so it won't nag repeat visitors.
-->
<script>
(function () {
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
  var isStandalone = window.navigator.standalone === true;
  if (!isIOS || !isSafari || isStandalone) return;
  if (localStorage.getItem('bhcoc-install-banner-dismissed')) return;

  var banner = document.createElement('div');
  banner.style.cssText = 'position:fixed; left:16px; right:16px; bottom:16px; z-index:99999; background:#7A3E1D; color:#fff; padding:12px 16px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,0.25); font-family:sans-serif; font-size:14px; display:flex; align-items:center; gap:12px;';

  var text = document.createElement('div');
  text.style.cssText = 'flex:1; line-height:1.4;';
  text.innerHTML = 'Install this app: tap <strong>Share</strong> ↑ then <strong>"Add to Home Screen"</strong>';
  banner.appendChild(text);

  var closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.setAttribute('aria-label', 'Dismiss');
  closeBtn.style.cssText = 'background:none; border:none; color:#fff; font-size:18px; cursor:pointer; padding:4px 8px; line-height:1; flex-shrink:0;';
  closeBtn.addEventListener('click', function () {
    banner.remove();
    localStorage.setItem('bhcoc-install-banner-dismissed', '1');
    if (window.bhcocTrack) window.bhcocTrack('ios_banner_dismissed');
  });
  banner.appendChild(closeBtn);

  document.body.appendChild(banner);
  if (window.bhcocTrack) window.bhcocTrack('ios_banner_shown');
})();
</script>
