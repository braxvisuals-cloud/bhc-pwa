<!--
  Bush Hills Church of Christ - Live stream auto-embed + recent videos
  Paste into: Durable > Website Settings > Integrations > Custom Code > Footer Code

  On the /service-stream page only:
  1. Asks the Cloudflare Worker whether the channel is live right now. If
     yes, swaps the existing video iframe to the live video (normal
     youtube.com/embed/VIDEO_ID format). If the stream was live and just
     ended, swaps back to the chosen waiting-music video automatically -
     without this, the iframe is just left pointed at the now-ended live
     video, which YouTube shows as "Video unavailable - this live stream
     recording is not available." Keeps re-checking every 20 seconds
     while someone stays on the page, not just once on arrival - otherwise
     someone already sitting on the page when the stream actually starts
     (or ends) would need to manually refresh to see it swap over. (The
     Worker's own 5-minute response cache is a separate, lower-level delay
     this doesn't change - see the README's troubleshooting section.)

     The "waiting video" to revert to is captured once, the first time
     this page loads this visit, before any live-check happens - so it's
     always Durable's true static default, never something this script
     already swapped in.
  2. Renders a "Recent Videos" row of the channel's 3 latest uploads right
     under the video. Clicking one plays it in the main player above
     (stays on the site, no redirect to YouTube), and reveals a "Back to
     Live Stream" / "Back to Main Video" button that restores whatever the
     main slot should currently be showing - no page refresh needed. While
     someone's watching a recent video this way, the periodic re-check
     leaves the player alone (doesn't yank them back to the live stream, or
     revert them to the waiting video, mid-recent-video) - it just keeps
     the "Back to..." button's label and destination current for when they
     do return.

  Durable's site is a Next.js single-page app - clicking nav links doesn't
  reload the page, it swaps content in place. So this script polls the
  current URL and adds/removes the Recent Videos section as you navigate
  to and away from /service-stream, instead of only checking once on
  initial load (which left it stuck on-screen when navigating elsewhere).
-->
<script>
(function () {
  var WORKER_URL = 'https://bhcoclivecheck-98db.braxvisuals.workers.dev/';
  var LIVE_CHECK_INTERVAL_MS = 20000;
  var waitingVideoSrc = null;
  var originalSrc = null;
  var wasLive = false;
  var viewingRecentVideo = false;
  var backButton = null;
  var cachedData = null;
  var lastPath = null;
  var lastLiveCheckAt = 0;

  function playInMainPlayer(videoId) {
    viewingRecentVideo = true;
    var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
    if (!iframe) return;
    iframe.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1';
    iframe.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (backButton) backButton.style.display = 'inline-block';
    if (window.bhcocTrack) window.bhcocTrack('recent_video_clicked');
  }

  function goBackToOriginal() {
    viewingRecentVideo = false;
    var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
    if (!iframe || !originalSrc) return;
    iframe.src = originalSrc;
    iframe.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (backButton) backButton.style.display = 'none';
  }

  function removeRecentVideos() {
    var existing = document.getElementById('bhcoc-recent-videos');
    if (existing) existing.remove();
    backButton = null;
  }

  function renderRecentVideos(videos) {
    if (!videos || !videos.length) return;

    removeRecentVideos();

    var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
    var videoSection = iframe ? iframe.closest('section') : null;
    if (!videoSection || !videoSection.parentElement) return;

    var wrap = document.createElement('div');
    wrap.id = 'bhcoc-recent-videos';
    wrap.style.cssText = 'max-width:1100px; margin:0 auto; padding:32px 16px;';

    var headingRow = document.createElement('div');
    headingRow.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; margin-bottom:16px;';

    var heading = document.createElement('h3');
    heading.textContent = 'Recent Videos';
    heading.style.cssText = 'font-size:20px; font-weight:700; margin:0;';
    headingRow.appendChild(heading);

    backButton = document.createElement('button');
    backButton.type = 'button';
    backButton.textContent = wasLive ? '← Back to Live Stream' : '← Back to Main Video';
    backButton.style.cssText = 'display:none; padding:6px 14px; border-radius:9999px; border:1px solid currentColor; background:none; cursor:pointer; font-size:13px; font-weight:600; color:inherit;';
    backButton.addEventListener('click', goBackToOriginal);
    headingRow.appendChild(backButton);

    wrap.appendChild(headingRow);

    var row = document.createElement('div');
    row.style.cssText = 'display:flex; gap:16px; flex-wrap:wrap; justify-content:center;';

    videos.forEach(function (v) {
      var card = document.createElement('button');
      card.type = 'button';
      card.style.cssText = 'display:block; width:280px; max-width:100%; text-align:left; background:none; border:none; padding:0; cursor:pointer; font:inherit; color:inherit;';

      var img = document.createElement('img');
      img.src = v.thumbnail;
      img.alt = v.title;
      img.style.cssText = 'width:100%; border-radius:8px; display:block;';

      var title = document.createElement('div');
      title.textContent = v.title;
      title.style.cssText = 'margin-top:8px; font-size:14px; font-weight:600; line-height:1.3;';

      card.appendChild(img);
      card.appendChild(title);
      card.addEventListener('click', function () { playInMainPlayer(v.videoId); });
      row.appendChild(card);
    });

    wrap.appendChild(row);
    videoSection.parentElement.insertBefore(wrap, videoSection.nextSibling);
  }

  function applyLiveCheck(data, isInitialLoad) {
    cachedData = data;
    var isLiveNow = !!(data && data.isLive && data.videoId);

    if (!viewingRecentVideo) {
      var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
      if (iframe) {
        if (isLiveNow) {
          var liveEmbedSrc = 'https://www.youtube.com/embed/' + data.videoId + '?autoplay=1';
          if (iframe.src !== liveEmbedSrc) {
            iframe.src = liveEmbedSrc;
            if (window.bhcocTrack) window.bhcocTrack('live_swap_triggered');
          }
          originalSrc = liveEmbedSrc;
        } else if (waitingVideoSrc) {
          if (iframe.src !== waitingVideoSrc) {
            iframe.src = waitingVideoSrc;
            if (window.bhcocTrack) window.bhcocTrack('live_ended_reverted');
          }
          originalSrc = waitingVideoSrc;
        }
      }
    }
    wasLive = isLiveNow;

    if (isInitialLoad) {
      renderRecentVideos(data && data.recentVideos);
    }
  }

  function checkLiveStatus(isInitialLoad) {
    fetch(WORKER_URL)
      .then(function (res) { return res.json(); })
      .then(function (data) { applyLiveCheck(data, isInitialLoad); })
      .catch(function () {
        // Fail silently - leave the page exactly as Durable rendered it.
      });
  }

  function enterServiceStreamPage() {
    wasLive = false;
    viewingRecentVideo = false;
    if (!waitingVideoSrc) {
      var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
      waitingVideoSrc = iframe ? iframe.src : null;
    }
    originalSrc = waitingVideoSrc;
    lastLiveCheckAt = Date.now();
    checkLiveStatus(true);
  }

  function syncToCurrentPage() {
    var path = window.location.pathname;

    if (path !== lastPath) {
      lastPath = path;
      if (path === '/service-stream') {
        enterServiceStreamPage();
      } else {
        removeRecentVideos();
      }
      return;
    }

    if (path === '/service-stream' && Date.now() - lastLiveCheckAt >= LIVE_CHECK_INTERVAL_MS) {
      lastLiveCheckAt = Date.now();
      checkLiveStatus(false);
    }
  }

  syncToCurrentPage();
  setInterval(syncToCurrentPage, 500);
})();
</script>
