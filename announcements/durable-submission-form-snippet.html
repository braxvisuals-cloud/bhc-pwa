<!--
  Bush Hills Church of Christ - Announcement submission form
  Suggested placement: an "Embed object with code" block on a private/
  unlinked page (e.g. /announcements-admin), NOT the public homepage -
  so it's not something random visitors stumble into. Anyone with the
  page URL still needs the PIN to actually submit.

  Replace WORKER_URL_HERE and the PIN prompt stays client-side only for
  UX; the real check happens server-side in the Worker.
-->
<div style="max-width:500px; margin:0 auto; padding:24px;">
  <textarea id="bhcoc-announce-text" rows="6" placeholder="Write the announcement, rough is fine - AI will clean up the phrasing." style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; font:inherit; box-sizing:border-box;"></textarea>
  <input id="bhcoc-announce-pin" type="password" placeholder="PIN" style="width:100%; margin-top:8px; padding:12px; border-radius:8px; border:1px solid #ccc; font:inherit; box-sizing:border-box;">
  <button id="bhcoc-announce-submit" type="button" style="margin-top:8px; padding:12px 20px; border-radius:8px; border:none; background:#7A3E1D; color:#fff; font-weight:600; cursor:pointer;">Post Announcement</button>
  <div id="bhcoc-announce-status" style="margin-top:8px; font-size:14px;"></div>
</div>
<script>
(function () {
  var WORKER_URL = 'https://fragrant-dream-ef85.braxvisuals.workers.dev/submit';

  document.getElementById('bhcoc-announce-submit').addEventListener('click', function () {
    var text = document.getElementById('bhcoc-announce-text').value.trim();
    var pin = document.getElementById('bhcoc-announce-pin').value;
    var status = document.getElementById('bhcoc-announce-status');

    if (!text) { status.textContent = 'Write something first.'; return; }

    status.textContent = 'Posting...';
    fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, pin: pin }),
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          status.textContent = result.data.error || 'Something went wrong.';
          return;
        }
        status.textContent = 'Posted! Cleaned version: "' + result.data.cleanedText + '"';
        document.getElementById('bhcoc-announce-text').value = '';
        document.getElementById('bhcoc-announce-pin').value = '';
      })
      .catch(function () { status.textContent = 'Network error - try again.'; });
  });
})();
</script>
