<!--
  Bush Hills Church of Christ - Announcements feed (rotating strip)
  Paste into: Durable > Website Settings > Integrations > Custom Code > Footer Code
  (add as an ADDITIONAL script alongside the live-stream and iOS-banner
  scripts already there - do not replace them)

  Renders a compact single-line strip wherever an element with
  id="bhcoc-announcements-feed" exists on the page (an empty
  <div id="bhcoc-announcements-feed"></div> added via an Embed/HTML
  block). Shows one announcement at a time, fading to the next every 6
  seconds - like a small reel instead of a stacked list. If only one
  announcement exists, it just displays it with no rotation. If that div
  isn't present on the current page, this script does nothing.
-->
<script>
(function () {
  var target = document.getElementById('bhcoc-announcements-feed');
  if (!target) return;

  var WORKER_URL = 'https://fragrant-dream-ef85.braxvisuals.workers.dev/list';
  var ROTATE_MS = 6000;

  target.style.cssText = 'max-width:700px; margin:0 auto; padding:14px 20px; min-height:24px; display:flex; align-items:center; justify-content:center; text-align:center;';

  var textEl = document.createElement('div');
  textEl.style.cssText = 'font-size:15px; line-height:1.4; transition:opacity 0.5s ease; opacity:1;';
  target.appendChild(textEl);

  fetch(WORKER_URL)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var announcements = (data && data.announcements) || [];

      if (!announcements.length) {
        textEl.textContent = 'No announcements right now — check back soon!';
        textEl.style.color = '#888';
        textEl.style.fontSize = '14px';
        return;
      }

      var index = 0;
      textEl.textContent = announcements[0].cleaned_text;

      if (announcements.length > 1) {
        setInterval(function () {
          textEl.style.opacity = '0';
          setTimeout(function () {
            index = (index + 1) % announcements.length;
            textEl.textContent = announcements[index].cleaned_text;
            textEl.style.opacity = '1';
          }, 500);
        }, ROTATE_MS);
      }
    })
    .catch(function () {});
})();
</script>
