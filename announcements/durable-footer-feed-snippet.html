<!--
  Bush Hills Church of Christ - Announcements feed
  Paste into: Durable > Website Settings > Integrations > Custom Code > Footer Code
  (add as an ADDITIONAL script alongside the live-stream and iOS-banner
  scripts already there - do not replace them)

  Renders a list of active announcements wherever an element with
  id="bhcoc-announcements-feed" exists on the page (add an empty
  <div id="bhcoc-announcements-feed"></div> via an Embed/HTML block
  wherever you want the feed to show, e.g. the homepage). If that div
  isn't present on the current page, this script does nothing.
-->
<script>
(function () {
  var target = document.getElementById('bhcoc-announcements-feed');
  if (!target) return;

  var WORKER_URL = 'https://fragrant-dream-ef85.braxvisuals.workers.dev/list';

  fetch(WORKER_URL)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var announcements = (data && data.announcements) || [];
      if (!announcements.length) return;

      announcements.forEach(function (a) {
        var card = document.createElement('div');
        card.style.cssText = 'padding:16px; border-radius:8px; background:#f5f0e8; margin-bottom:12px;';

        var text = document.createElement('div');
        text.textContent = a.cleaned_text;
        text.style.cssText = 'font-size:15px; line-height:1.5;';
        card.appendChild(text);

        var date = document.createElement('div');
        date.textContent = new Date(a.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        date.style.cssText = 'font-size:12px; color:#888; margin-top:6px;';
        card.appendChild(date);

        target.appendChild(card);
      });
    })
    .catch(function () {});
})();
</script>
