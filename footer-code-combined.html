<!--
  Bush Hills Church of Christ - Durable Footer Code (COMBINED)
  Paste into: Durable > Website Settings > Integrations > Custom Code > Footer Code

  This file is the exact combined contents of all four footer scripts,
  glued together in the required order, so you can copy this ONE file
  instead of stitching four together by hand. Replace the entire Footer
  Code box with this file's contents whenever any of the four source
  scripts change - never paste just one script in isolation, that wipes
  the other three out silently.

  Source files (kept separate for readability/editing - this file is
  generated from them, not the other way around):
    1. live-stream/durable-footer-snippet.html   - live-stream swap + recent videos
    2. ios-install-banner-snippet.html            - iOS install banner
    3. announcements/durable-footer-feed-snippet.html - announcements ticker
    4. pwa-dashboard-router-snippet.html          - hidden PWA dashboard router
-->
<script>
(function () {
  var WORKER_URL = 'https://bhcoclivecheck-98db.braxvisuals.workers.dev/';
  var originalSrc = null;
  var wasLive = false;
  var backButton = null;
  var cachedData = null;
  var lastPath = null;

  function swapLiveVideo(data) {
    if (!data || !data.isLive || !data.videoId) return;
    var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
    if (!iframe) return;
    var liveEmbedSrc = 'https://www.youtube.com/embed/' + data.videoId + '?autoplay=1';
    if (iframe.src !== liveEmbedSrc) {
      iframe.src = liveEmbedSrc;
      if (window.bhcocTrack) window.bhcocTrack('live_swap_triggered');
    }
    wasLive = true;
  }

  function playInMainPlayer(videoId) {
    var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
    if (!iframe) return;
    iframe.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1';
    iframe.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (backButton) backButton.style.display = 'inline-block';
    if (window.bhcocTrack) window.bhcocTrack('recent_video_clicked');
  }

  function goBackToOriginal() {
    var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
    if (!iframe || !originalSrc) return;
    iframe.src = originalSrc;
    iframe.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (backButton) backButton.style.display = 'none';
  }

  function removeRecentVideos() {
    var existing = document.getElementById('bhcoc-recent-videos');
    if (existing) existing.remove();
    backButton = null;
  }

  function renderRecentVideos(videos) {
    if (!videos || !videos.length) return;

    removeRecentVideos();

    var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
    var videoSection = iframe ? iframe.closest('section') : null;
    if (!videoSection || !videoSection.parentElement) return;

    var wrap = document.createElement('div');
    wrap.id = 'bhcoc-recent-videos';
    wrap.style.cssText = 'max-width:1100px; margin:0 auto; padding:32px 16px;';

    var headingRow = document.createElement('div');
    headingRow.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; margin-bottom:16px;';

    var heading = document.createElement('h3');
    heading.textContent = 'Recent Videos';
    heading.style.cssText = 'font-size:20px; font-weight:700; margin:0;';
    headingRow.appendChild(heading);

    backButton = document.createElement('button');
    backButton.type = 'button';
    backButton.textContent = wasLive ? '← Back to Live Stream' : '← Back to Main Video';
    backButton.style.cssText = 'display:none; padding:6px 14px; border-radius:9999px; border:1px solid currentColor; background:none; cursor:pointer; font-size:13px; font-weight:600; color:inherit;';
    backButton.addEventListener('click', goBackToOriginal);
    headingRow.appendChild(backButton);

    wrap.appendChild(headingRow);

    var row = document.createElement('div');
    row.style.cssText = 'display:flex; gap:16px; flex-wrap:wrap; justify-content:center;';

    videos.forEach(function (v) {
      var card = document.createElement('button');
      card.type = 'button';
      card.style.cssText = 'display:block; width:280px; max-width:100%; text-align:left; background:none; border:none; padding:0; cursor:pointer; font:inherit; color:inherit;';

      var img = document.createElement('img');
      img.src = v.thumbnail;
      img.alt = v.title;
      img.style.cssText = 'width:100%; border-radius:8px; display:block;';

      var title = document.createElement('div');
      title.textContent = v.title;
      title.style.cssText = 'margin-top:8px; font-size:14px; font-weight:600; line-height:1.3;';

      card.appendChild(img);
      card.appendChild(title);
      card.addEventListener('click', function () { playInMainPlayer(v.videoId); });
      row.appendChild(card);
    });

    wrap.appendChild(row);
    videoSection.parentElement.insertBefore(wrap, videoSection.nextSibling);
  }

  function enterServiceStreamPage() {
    wasLive = false;
    originalSrc = null;

    function applyData(data) {
      cachedData = data;
      swapLiveVideo(data);
      var iframe = document.querySelector('iframe[src*="youtube.com/embed/"]');
      originalSrc = iframe ? iframe.src : null;
      renderRecentVideos(data && data.recentVideos);
    }

    fetch(WORKER_URL)
      .then(function (res) { return res.json(); })
      .then(applyData)
      .catch(function () {
        // Fail silently - leave the page exactly as Durable rendered it.
      });
  }

  function syncToCurrentPage() {
    var path = window.location.pathname;
    if (path === lastPath) return;
    lastPath = path;

    if (path === '/service-stream') {
      enterServiceStreamPage();
    } else {
      removeRecentVideos();
    }
  }

  syncToCurrentPage();
  setInterval(syncToCurrentPage, 500);
})();
</script>
<script>
(function () {
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
  var isStandalone = window.navigator.standalone === true;
  if (!isIOS || !isSafari || isStandalone) return;
  if (sessionStorage.getItem('bhcoc-install-banner-dismissed')) return;

  var banner = document.createElement('div');
  banner.style.cssText = 'position:fixed; left:16px; right:16px; bottom:16px; z-index:99999; background:#7A3E1D; color:#fff; padding:12px 16px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,0.25); font-family:sans-serif; font-size:14px; display:flex; align-items:center; gap:12px;';

  var text = document.createElement('div');
  text.style.cssText = 'flex:1; line-height:1.4;';
  text.innerHTML = 'Install this app: tap <strong>Share</strong> ↑ then <strong>"Add to Home Screen"</strong>';
  banner.appendChild(text);

  var closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.setAttribute('aria-label', 'Dismiss');
  closeBtn.style.cssText = 'background:none; border:none; color:#fff; font-size:18px; cursor:pointer; padding:4px 8px; line-height:1; flex-shrink:0;';
  closeBtn.addEventListener('click', function () {
    banner.remove();
    sessionStorage.setItem('bhcoc-install-banner-dismissed', '1');
    if (window.bhcocTrack) window.bhcocTrack('ios_banner_dismissed');
  });
  banner.appendChild(closeBtn);

  document.body.appendChild(banner);
  if (window.bhcocTrack) window.bhcocTrack('ios_banner_shown');
})();
</script>
<script>
(function () {
  var target = document.getElementById('bhcoc-announcements-feed');
  if (!target) return;

  var WORKER_URL = 'https://fragrant-dream-ef85.braxvisuals.workers.dev/list';
  var ROTATE_MS = 6000;

  target.style.cssText = 'max-width:700px; margin:0 auto; padding:14px 20px; min-height:24px; display:flex; align-items:center; justify-content:center; text-align:center;';

  var textEl = document.createElement('div');
  textEl.style.cssText = 'font-size:15px; line-height:1.4; transition:opacity 0.5s ease; opacity:1;';
  target.appendChild(textEl);

  fetch(WORKER_URL)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var announcements = (data && data.announcements) || [];

      if (!announcements.length) {
        textEl.textContent = 'No announcements right now — check back soon!';
        textEl.style.color = '#888';
        textEl.style.fontSize = '14px';
        return;
      }

      var index = 0;
      textEl.textContent = announcements[0].cleaned_text;

      if (announcements.length > 1) {
        setInterval(function () {
          textEl.style.opacity = '0';
          setTimeout(function () {
            index = (index + 1) % announcements.length;
            textEl.textContent = announcements[index].cleaned_text;
            textEl.style.opacity = '1';
          }, 500);
        }, ROTATE_MS);
      }
    })
    .catch(function () {});
})();
</script>
<script>
(function () {
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (!isStandalone) return;

  var DASHBOARD_PATH = '/dashboard';
  var NOTES_PATH = '/notes';
  var BYPASS_KEY = 'bhcoc-pwa-full-site';

  if (window.location.search.indexOf('app_full=1') !== -1) {
    sessionStorage.setItem(BYPASS_KEY, '1');
  } else if (
    window.location.pathname === '/' &&
    !sessionStorage.getItem(BYPASS_KEY)
  ) {
    window.location.replace(DASHBOARD_PATH);
    return;
  }

  function isAppScreen(path) {
    return path === DASHBOARD_PATH || path === NOTES_PATH;
  }

  function ensureHomeButton() {
    var existing = document.getElementById('bhcoc-pwa-home-btn');
    if (window.location.pathname === DASHBOARD_PATH) {
      if (existing) existing.remove();
      return;
    }
    if (existing) return;

    var btn = document.createElement('a');
    btn.id = 'bhcoc-pwa-home-btn';
    btn.href = DASHBOARD_PATH;
    btn.setAttribute('aria-label', 'Back to Dashboard');
    btn.textContent = '⌂';
    btn.style.cssText = 'position:fixed; right:16px; bottom:16px; z-index:99999; width:52px; height:52px; border-radius:50%; background:#7A3E1D; color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; text-decoration:none; box-shadow:0 4px 16px rgba(0,0,0,0.3);';
    document.body.appendChild(btn);
  }

  var hiddenChromeEls = [];

  function hideSiteChrome() {
    if (hiddenChromeEls.length) return;
    var content = document.getElementById('bhcoc-dashboard') || document.getElementById('bhcoc-notes');
    if (!content) return;

    var node = content;
    while (node && node.parentElement && node !== document.body) {
      if (node.previousElementSibling) {
        var sib = node.previousElementSibling;
        while (sib) {
          sib.style.setProperty('display', 'none', 'important');
          hiddenChromeEls.push(sib);
          sib = sib.previousElementSibling;
        }
        return;
      }
      node = node.parentElement;
    }
  }

  function restoreSiteChrome() {
    if (!hiddenChromeEls.length) return;
    hiddenChromeEls.forEach(function (el) {
      el.style.removeProperty('display');
    });
    hiddenChromeEls = [];
  }

  var lastPath = null;
  function sync() {
    var path = window.location.pathname;
    lastPath = path;
    ensureHomeButton();

    if (isAppScreen(path)) {
      hideSiteChrome();
    } else {
      restoreSiteChrome();
    }
  }
  sync();
  setInterval(sync, 500);
})();
</script>
